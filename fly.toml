# Fly.io deployment config
# Deploy: fly launch --config fly.toml
# See: https://fly.io/docs/reference/configuration/

app = "synthesia"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  NUM_AGENTS = "30"
  MAX_FPS = "30"
  PYTHONUNBUFFERED = "1"

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  grace_period = "15s"
  interval = "30s"
  method = "GET"
  path = "/health"
  timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
